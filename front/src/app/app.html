<div *ngIf="cargando" class="splash-screen">
  <div class="spinner"></div> <!-- O tu mat-spinner si usas Angular Material -->
  <p>Verificando sesión, por favor espere...</p>
</div>

<div class="app-layout" *ngIf="!cargando">
  <!-- Barra Lateral (Sidebar) -->
  <aside class="sidebar" *ngIf="mostrarNavbar">
    <div class="sidebar-brand">
      <span class="brand-logo">🚜</span>
      <span class="brand-title">AgroRed</span>
      <!-- <span class="brand-badge">PRO</span> -->
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/publicaciones" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">article</span> Publicaciones
      </a>
      <a routerLink="/perfil" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">person</span> Mi Perfil
      </a>

      <a *ngIf="esAdmin" routerLink="/dashboard/usuarios" routerLinkActive="active" class="nav-item admin-link">
        <span class="material-symbols-outlined">admin_panel_settings</span> Dashboard Usuarios
      </a>
    </nav>

    <div class="sidebar-footer">
      <a (click)="logout()" class="nav-item logout-item">
        <span class="material-symbols-outlined">logout</span> Cerrar Sesión
      </a>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
<div class="modal-overlay" *ngIf="mostrarModalExpiracion">
  <div class="modal-content">
    <h3>⚠️ Tu sesión está por expirar</h3>
    <p>Por seguridad, tu sesión caducará en unos segundos. ¿Deseas extenderla?</p>
    <div class="modal-actions">
      <button (click)="extendSession()" class="btn-primary">Extender Sesión</button>
      <button (click)="cancelarExtension()" class="btn-cancelar">Cancelar</button>
    </div>
  </div>
</div>
