<div class="app-layout">
  <!-- Barra Lateral (Sidebar) -->
  <aside class="sidebar" *ngIf="mostrarNavbar">
    <div class="sidebar-brand">
      <span class="brand-logo">🚜</span>
      <span class="brand-title">AgroRed</span>
      <!-- <span class="brand-badge">PRO</span> -->
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/publicaciones" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">article</span> Publicaciones
      </a>
      <a routerLink="/perfil" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">person</span> Mi Perfil
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/login" class="nav-item logout-item">
        <span class="material-symbols-outlined">logout</span> Cerrar Sesión
      </a>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
<div class="modal-overlay" *ngIf="mostrarModalExpiracion">
  <div class="modal-content">
    <h3>⚠️ Tu sesión está por expirar</h3>
    <p>Por seguridad, tu sesión caducará en unos segundos. ¿Deseas extenderla?</p>
    <div class="modal-actions">
      <button (click)="extendSession()" class="btn-primary">Extender Sesión</button>
      <button (click)="cerrarSesionPorExpiracion()" class="btn-secondary">Cerrar Sesión</button>
    </div>
  </div>
</div>
