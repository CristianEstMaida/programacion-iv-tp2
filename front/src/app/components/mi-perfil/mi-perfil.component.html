<div class="perfil-container">
  <div class="perfil-card">
    <h2>Mi Perfil</h2>
    
    <div class="avatar-section">
      <img [src]="usuario.imagenPerfil || 'assets/default-avatar.png'" alt="Foto de perfil" class="avatar">
    </div>

    <form (submit)="actualizarPerfil()">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" [(ngModel)]="usuario.nombre" name="nombre">
      </div>

      <div class="form-group">
        <label>Apellido:</label>
        <input type="text" [(ngModel)]="usuario.apellido" name="apellido">
      </div>

      <div class="form-group">
        <label>Nombre de Usuario:</label>
        <input type="text" [(ngModel)]="usuario.username" name="username" disabled>
      </div>

      <div class="form-group">
        <label>Descripción breve:</label>
        <textarea [(ngModel)]="usuario.descripcion" name="descripcion"></textarea>
      </div>

      <button type="submit" class="submit-btn">Guardar Cambios</button>
    </form>
  </div>
</div>
