<main>
  <div class="auth-container">
    <div class="card">
      <div class="header">
        <div class="icon-box">
          <span class="material-symbols-outlined">insights</span>
        </div>
        <h1>Iniciar Sesión</h1>
        <p>Bienvenido de nuevo a PulseNet</p>
      </div>

      <!-- Vinculamos el FormGroup -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label><span>Correo electrónico o Usuario</span></label>
          <div class="input-container">
            <span class="material-symbols-outlined">mail</span>
            <!-- Usamos formControlName en lugar de ngModel -->
            <input formControlName="identificador" placeholder="nombre@empresa.com o usuario" type="text"/>
          </div>
        </div>

        <div class="form-group">
          <label><span>Contraseña</span></label>
          <div class="input-container">
            <span class="material-symbols-outlined">key</span>
            <input formControlName="password" placeholder="••••••••••••" type="password"/>
          </div>
        </div>

        <button class="submit-btn" type="submit" [disabled]="loginForm.invalid">
          <span>Acceder a mi Red</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <p class="switch-link">
        ¿No tienes una cuenta? <a routerLink="/registro">Crear Cuenta</a>
      </p>
    </div>
  </div>
</main>
