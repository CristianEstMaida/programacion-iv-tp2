<div class="container">
  <h2>Panel de Gestión de Usuarios (Administrador)</h2>

  <div class="action-bar">
    <button class="btn-custom btn-activar" (click)="mostrarFormulario = !mostrarFormulario">
      {{ mostrarFormulario ? 'Cancelar' : '+ Registrar Nuevo Usuario' }}
    </button>
  </div>

  <!-- FORMULARIO DE NUEVO USUARIO (Diseño con CSS Nativo) -->
  <div class="card form-card" *ngIf="mostrarFormulario" appFadeIn>
    <h3>Crear Nuevo Usuario</h3>
    
    <form (ngSubmit)="crearUsuario()" class="custom-form">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="input-control" [(ngModel)]="nuevoUsuario.nombre" name="nombre" required>
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input type="text" class="input-control" [(ngModel)]="nuevoUsuario.apellido" name="apellido" required>
      </div>

      <div class="form-group">
        <label>Email / Username</label>
        <input type="email" class="input-control" [(ngModel)]="nuevoUsuario.email" name="email" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" class="input-control" [(ngModel)]="nuevoUsuario.password" name="password" required>
      </div>

      <!-- RADIO BUTTONS CON CSS PURO -->
      <div class="form-group">
        <label class="label-block">Perfil / Rol:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="perfil" value="usuario" [(ngModel)]="nuevoUsuario.perfil">
            Usuario
          </label>
          <label class="radio-label">
            <input type="radio" name="perfil" value="administrador" [(ngModel)]="nuevoUsuario.perfil">
            Administrador
          </label>
        </div>
      </div>

      <button type="submit" class="btn-custom btn-activar">Guardar Usuario</button>
    </form>
  </div>

  <div class="card" appFadeIn>
    <table class="table">
      <thead>
        <tr>
          <th>Nombre y Apellido</th>
          <th>Email</th>
          <th>Perfil / Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Iteramos directamente el array completo con tu directiva de hover -->
        <tr *ngFor="let u of usuarios" appHover="#f8fafc">
          <td>{{ u.nombre | capitalize }} {{ u.apellido | capitalize }}</td>
          <td>{{ u.email }}</td>
          
          <td>
            <span class="badge" [appRolStyle]="u.perfil">
              {{ u.perfil | capitalize }}
            </span>
          </td>

          <td>
            <span [class.text-activo]="u.activo" [class.text-inactivo]="!u.activo">
              {{ u.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>

          <td>
            <button *ngIf="u.activo" class="btn-custom btn-baja" (click)="darDeBaja(u._id)">
              Dar de baja
            </button>
            <button *ngIf="!u.activo" class="btn-custom btn-activar" (click)="activarUsuario(u._id)">
              Activar
            </button>
          </td>
        </tr>

        <!-- Mensaje si la lista está completamente vacía -->
        <tr *ngIf="!usuarios || usuarios.length === 0">
          <td colspan="5" class="empty-message">No hay usuarios registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
