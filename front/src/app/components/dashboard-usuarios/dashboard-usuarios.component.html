<div class="container">
  <h2>Panel de Gestión de Usuarios (Administrador)</h2>

  <div class="card" appFadeIn>
    <table class="table">
      <thead>
        <tr>
          <th>Nombre y Apellido</th>
          <th>Email</th>
          <th>Perfil / Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Iteramos directamente el array completo con tu directiva de hover -->
        <tr *ngFor="let u of usuarios" appHover="#f8fafc">
          <td>{{ u.nombre | capitalize }} {{ u.apellido | capitalize }}</td>
          <td>{{ u.email }}</td>
          
          <td>
            <span class="badge" [appRolStyle]="u.perfil">
              {{ u.perfil | capitalize }}
            </span>
          </td>

          <td>
            <span [class.text-activo]="u.activo" [class.text-inactivo]="!u.activo">
              {{ u.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>

          <td>
            <button *ngIf="u.activo" class="btn-custom btn-baja" (click)="darDeBaja(u._id)">
              Dar de baja
            </button>
            <button *ngIf="!u.activo" class="btn-custom btn-activar" (click)="activarUsuario(u._id)">
              Activar
            </button>
          </td>
        </tr>

        <!-- Mensaje si la lista está completamente vacía -->
        <tr *ngIf="!usuarios || usuarios.length === 0">
          <td colspan="5" class="empty-message">No hay usuarios registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
