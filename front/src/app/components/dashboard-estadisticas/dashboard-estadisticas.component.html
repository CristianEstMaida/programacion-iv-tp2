<div class="estadisticas-container">
  <h2>Panel de Estadísticas y Gráficos</h2>

  <!-- Selector de Lapso de Tiempo exigido por la consigna -->
  <div class="filtro-tiempo">
    <label>Seleccionar lapso de tiempo:</label>
    <select [(ngModel)]="lapsoTiempo" (change)="actualizarFiltro()" class="input-control">
      <option value="semana">Última Semana</option>
      <option value="mes">Último Mes</option>
      <option value="anio">Último Año</option>
    </select>
  </div>

  <!-- Contenedores de los Gráficos (Varían en tipo: barras, líneas, torta) -->
  <div class="graficos-grid">
    <div class="card-grafico">
      <h3>Publicaciones por Usuario</h3>
      <canvas #graficoPublicaciones></canvas>
    </div>

    <div class="card-grafico">
      <h3>Cantidad de Comentarios en el Tiempo</h3>
      <canvas #graficoComentariosTiempo></canvas>
    </div>

    <div class="card-grafico">
      <h3>Comentarios en cada Publicación</h3>
      <canvas #graficoComentariosPubli></canvas>
    </div>
  </div>
</div>
