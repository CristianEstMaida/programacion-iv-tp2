<div class="estadisticas-container">
  <h2>Panel de Estadísticas y Gráficos</h2>

  <!-- Filtros de Rango de Fechas (Desde / Hasta) -->
  <div class="filtro-fechas-card">
    <div class="input-group">
      <label for="desde">Desde:</label>
      <input type="date" id="desde" [(ngModel)]="fechaDesde" class="input-control">
    </div>

    <div class="input-group">
      <label for="hasta">Hasta:</label>
      <input type="date" id="hasta" [(ngModel)]="fechaHasta" class="input-control">
    </div>

    <button class="btn-filtrar" (click)="actualizarFiltro()">Aplicar Filtro</button>
  </div>

  <!-- Contenedores de los Gráficos -->
  <div class="graficos-grid">
    <div class="card-grafico">
      <h3>Publicaciones por Usuario</h3>
      <canvas #graficoPublicaciones></canvas>
    </div>

    <div class="card-grafico">
      <h3>Cantidad de Comentarios en el Tiempo</h3>
      <canvas #graficoComentariosTiempo></canvas>
    </div>

    <div class="card-grafico">
      <h3>Comentarios en cada Publicación</h3>
      <canvas #graficoComentariosPubli></canvas>
    </div>
  </div>
</div>
